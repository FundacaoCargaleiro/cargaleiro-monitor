  {tecnica:"Pintura sobre jarra em faiança",ano:1956,altura:null,largura:34,area:null,cm2:null,anoVenda:2021,valor:5250,leiloeira:""},
];

const fmtEur = v => v != null ? new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",minimumFractionDigits:2,maximumFractionDigits:2}).format(v) : "—";
const fmtNum = v => v != null ? new Intl.NumberFormat("pt-PT",{minimumFractionDigits:0,maximumFractionDigits:2}).format(v) : "—";

function App() {
  const [obras, setObras] = useState(HISTORICO.map((o,i)=>({...o,id:i})));
  const [tab, setTab] = useState("historico");
  const [filtro, setFiltro] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [sortCol, setSortCol] = useState("cm2");
  const [sortDir, setSortDir] = useState("asc");
  const emptyForm = {tecnica:"",ano:"",altura:"",largura:"",anoVenda:"",valor:"",leiloeira:""};
  const [form, setForm] = useState(emptyForm);

  function toggleSort(col) {
    if (sortCol === col) setSortDir(d => d==="asc"?"desc":"asc");
    else { setSortCol(col); setSortDir("asc"); }
  }

  const obrasFiltradas = useMemo(() => {
    let arr = obras.filter(o =>
      o.tecnica.toLowerCase().includes(filtro.toLowerCase()) ||
      (o.leiloeira && o.leiloeira.toLowerCase().includes(filtro.toLowerCase())) ||
      (o.ano && String(o.ano).includes(filtro)) ||
      (o.anoVenda && String(o.anoVenda).includes(filtro))
    );
    arr.sort((a,b) => {
      const va = a[sortCol] ?? (sortDir==="asc"?Infinity:-Infinity);
      const vb = b[sortCol] ?? (sortDir==="asc"?Infinity:-Infinity);
      return sortDir==="asc" ? va-vb : vb-va;
    });
    return arr;
  }, [obras, filtro, sortCol, sortDir]);

  function handleAdd(e) {
    e.preventDefault();
    const h = form.altura ? +form.altura : null;
    const l = form.largura ? +form.largura : null;
    const area = h && l ? Math.round(h*l*100)/100 : null;
    const val = form.valor ? +form.valor : null;
    const cm2 = area && val ? Math.round((val/area)*100)/100 : null;
    setObras(p => [...p, {...form, id:Date.now(), ano:form.ano?+form.ano:null, altura:h, largura:l, area, anoVenda:form.anoVenda?+form.anoVenda:null, valor:val, cm2}]);
    setShowForm(false);
    setForm(emptyForm);
  }

  function exportCSV() {
    const h = ["Técnica","Ano","Altura","Largura/Diam.","Área (cm²)","Valor (€/cm²)","Ano de Venda","Valor de Venda (€)","Leiloeira"];
    const rows = obrasFiltradas.map(o => [o.tecnica,o.ano||"",o.altura||"",o.largura||"",o.area||"",o.cm2||"",o.anoVenda||"",o.valor||"",o.leiloeira||""]);
    const csv = [h,...rows].map(r=>r.join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download = `cargaleiro-leiloes-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  const totalObras = obras.length;
  const comValor = obras.filter(o=>o.valor);
  const totalVendas = comValor.reduce((s,o)=>s+(o.valor||0),0);
  const mediaValor = comValor.length ? totalVendas/comValor.length : 0;
  const mediaCm2 = obras.filter(o=>o.cm2).reduce((s,o)=>s+o.cm2,0) / (obras.filter(o=>o.cm2).length||1);

  const card = {background:BG,border:`1px solid ${BORDER}`,borderRadius:3,padding:"20px 24px"};
  const lbl = {fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:GRAY,marginBottom:5,display:"block"};
  const inp = {background:BG,border:`1px solid ${BORDER}`,color:BLACK,fontFamily:"Georgia,serif",fontSize:13,padding:"7px 10px",borderRadius:3,width:"100%",outline:"none"};

  function SortTh({col,label,cls}) {
    const active = sortCol===col;
    return <th className={cls||""} style={{cursor:"pointer",color:active?WINE:GRAY,userSelect:"none"}} onClick={()=>toggleSort(col)}>{label} {active?(sortDir==="asc"?"↑":"↓"):""}</th>;
  }

  return (
    <div style={{fontFamily:"Georgia,serif",background:BG,minHeight:"100vh",color:BLACK}}>

      {/* Header */}
      <div style={{borderBottom:`1px solid ${BORDER}`,padding:"0 32px",display:"flex",alignItems:"center",justifyContent:"space-between",background:BG2}}>
        <div style={{display:"flex",alignItems:"center"}}>
          <img src={`data:image/png;base64,${window.LOGO_B64}`} alt="Fundação Cargaleiro" style={{height:60,width:"auto"}}/>
          <div style={{borderLeft:`1px solid ${BORDER}`,paddingLeft:18,marginLeft:6}}>
            <div style={{fontSize:10,letterSpacing:2,textTransform:"uppercase",color:GRAY,marginBottom:2}}>Monitor de</div>
            <div style={{fontSize:20,color:WINE,letterSpacing:1}}>Leilões</div>
          </div>
        </div>
        <div style={{fontSize:11,color:GRAY,fontStyle:"italic"}}>{totalObras} obras registadas</div>
      </div>

      {/* Nav */}
      <div style={{display:"flex",borderBottom:`1px solid ${BORDER}`,padding:"0 32px"}}>
        {[["historico","Histórico de leilões"],["painel","Painel geral"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{background:"none",border:"none",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:13,padding:"11px 16px",color:tab===k?WINE:GRAY,borderBottom:tab===k?`2px solid ${WINE}`:"2px solid transparent",transition:"all 0.15s"}}>{l}</button>
        ))}
      </div>

      <div style={{padding:"24px 32px"}}>

        {tab==="painel" && <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:24}}>
            {[
              [totalObras,"Obras registadas"],
              [fmtEur(totalVendas),"Volume total"],
              [fmtEur(mediaValor),"Média por obra"],
              [fmtEur(mediaCm2)+"/cm²","Média €/cm²"],
            ].map(([n,l],i)=>(
              <div key={i} style={card}>
                <div style={{fontSize:24,color:WINE,marginBottom:5}}>{n}</div>
                <div style={{fontSize:10,letterSpacing:1.5,textTransform:"uppercase",color:GRAY}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={card}>
            <div style={{fontSize:11,letterSpacing:1.5,textTransform:"uppercase",color:GRAY,marginBottom:16}}>Distribuição por técnica</div>
            {Array.from(new Set(obras.map(o=>o.tecnica))).map(t=>{
              const grupo = obras.filter(o=>o.tecnica===t);
              const mediaT = grupo.filter(o=>o.cm2).reduce((s,o)=>s+(o.cm2||0),0)/(grupo.filter(o=>o.cm2).length||1);
              const maxT = Math.max(...obras.filter(o=>o.cm2).map(o=>o.cm2));
              return (
                <div key={t} style={{marginBottom:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                    <span style={{fontSize:12,color:GRAY}}>{t} <span style={{color:"#BBB"}}>({grupo.length})</span></span>
                    <span style={{fontSize:12,color:WINE}}>{fmtEur(mediaT)}/cm²</span>
                  </div>
                  <div style={{background:BORDER,height:3,borderRadius:2}}>
                    <div style={{background:WINE,height:3,borderRadius:2,width:`${Math.min(100,(mediaT/maxT)*100)}%`}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </>}

        {tab==="historico" && <>
          <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center"}}>
            <input style={{...inp,flex:1}} placeholder="Pesquisar por técnica, leiloeira, ano..." value={filtro} onChange={e=>setFiltro(e.target.value)}/>
            <button onClick={exportCSV} style={{background:"none",border:`1px solid ${BORDER}`,color:GRAY,cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,padding:"8px 16px",borderRadius:3,whiteSpace:"nowrap"}}>↓ Exportar CSV</button>
            <button onClick={()=>setShowForm(v=>!v)} style={{background:WINE,color:"#FFF",border:"none",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,padding:"8px 16px",borderRadius:3,whiteSpace:"nowrap"}}>+ Adicionar obra</button>
          </div>

          {showForm && (
            <div style={{...card,marginBottom:16}}>
              <form onSubmit={handleAdd}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 2fr",gap:12,marginBottom:12}}>
                  <div><label style={lbl}>Técnica</label><input style={inp} value={form.tecnica} onChange={e=>setForm(p=>({...p,tecnica:e.target.value}))} required/></div>
                  <div><label style={lbl}>Ano obra</label><input type="number" style={inp} value={form.ano} onChange={e=>setForm(p=>({...p,ano:e.target.value}))}/></div>
                  <div><label style={lbl}>Altura (cm)</label><input type="number" step="0.1" style={inp} value={form.altura} onChange={e=>setForm(p=>({...p,altura:e.target.value}))}/></div>
                  <div><label style={lbl}>Largura/Diâm. (cm)</label><input type="number" step="0.1" style={inp} value={form.largura} onChange={e=>setForm(p=>({...p,largura:e.target.value}))}/></div>
                  <div><label style={lbl}>Ano de venda</label><input type="number" style={inp} value={form.anoVenda} onChange={e=>setForm(p=>({...p,anoVenda:e.target.value}))}/></div>
                  <div><label style={lbl}>Leiloeira (opcional)</label><input style={inp} value={form.leiloeira} onChange={e=>setForm(p=>({...p,leiloeira:e.target.value}))}/></div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 5fr",gap:12,marginBottom:12}}>
                  <div><label style={lbl}>Valor de venda (€)</label><input type="number" step="0.01" style={inp} value={form.valor} onChange={e=>setForm(p=>({...p,valor:e.target.value}))}/></div>
                </div>
                {form.altura && form.largura && form.valor && (
                  <div style={{marginBottom:12,fontSize:12,color:WINE}}>
                    Área: {Math.round(+form.altura * +form.largura * 100)/100} cm² · €/cm²: {Math.round((+form.valor/(+form.altura*+form.largura))*100)/100}
                  </div>
                )}
                <div style={{display:"flex",gap:10}}>
                  <button type="submit" style={{background:WINE,color:"#FFF",border:"none",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,padding:"8px 18px",borderRadius:3}}>Guardar</button>
                  <button type="button" onClick={()=>setShowForm(false)} style={{background:"none",border:`1px solid ${BORDER}`,color:GRAY,cursor:"pointer",fontFamily:"Georgia,serif",fontSize:12,padding:"8px 18px",borderRadius:3}}>Cancelar</button>
                </div>
              </form>
            </div>
          )}

          <div style={{overflowX:"auto"}}>
            <table>
              <thead>
                <tr>
                  <SortTh col="tecnica" label="Técnica"/>
                  <SortTh col="ano" label="Ano" cls="num"/>
                  <SortTh col="altura" label="Altura" cls="num"/>
                  <SortTh col="largura" label="Larg./Diâm." cls="num"/>
                  <SortTh col="area" label="Área (cm²)" cls="num"/>
                  <SortTh col="cm2" label="€/cm²" cls="num"/>
                  <SortTh col="anoVenda" label="Ano venda" cls="num"/>
                  <SortTh col="valor" label="Valor de venda" cls="num"/>
                  <th>Leiloeira</th>
                </tr>
              </thead>
              <tbody>
                {obrasFiltradas.map((o,i)=>(
                  <tr key={o.id} className="hrow">
                    <td>{o.tecnica}</td>
                    <td className="num">{o.ano||"—"}</td>
                    <td className="num">{o.altura!=null?fmtNum(o.altura):"—"}</td>
                    <td className="num">{o.largura!=null?fmtNum(o.largura):"—"}</td>
                    <td className="num">{o.area!=null?fmtNum(o.area):"—"}</td>
                    <td className="cm2">{o.cm2!=null?fmtEur(o.cm2):"—"}</td>
                    <td className="num">{o.anoVenda||"—"}</td>
                    <td className="wine">{o.valor!=null?fmtEur(o.valor):"—"}</td>
                    <td style={{color:GRAY,fontSize:12}}>{o.leiloeira||""}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{paddingTop:10,fontSize:11,color:GRAY,fontStyle:"italic"}}>{obrasFiltradas.length} obras · Clicar nos cabeçalhos para ordenar.</div>
          </div>
        </>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
