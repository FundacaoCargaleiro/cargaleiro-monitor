<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Leilões — Fundação Manuel Cargaleiro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: #fff; color: #1A1A1A; }
    .hrow:hover { background: #FAFAF9; cursor: pointer; }
    input:focus, select:focus { border-color: #6B1A1A !important; outline: none; }
    select option { background: white; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #E8E0E0; }
    a { text-decoration: none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const WINE = "#6B1A1A";
const BLACK = "#1A1A1A";
const GRAY = "#6B6B6B";
const BORDER = "#E8E0E0";
const BG = "#FFFFFF";
const BG2 = "#FAFAF9";

// Configuração Airtable
const AT_TOKEN = "patxkmzRpc0AAi77q.d30dc72a4e4921f5e98d5833d06c8287114bba8aa5570573067971818caa2042";
const AT_BASE  = "apprSrFIqBVzgQWmY";
const AT_TABLE = "tblhldohdfFSYWROp";
const AT_URL   = `https://api.airtable.com/v0/${AT_BASE}/${AT_TABLE}`;
const AT_HEADS = { "Authorization": `Bearer ${AT_TOKEN}`, "Content-Type": "application/json" };

// Converter registo Airtable → objecto interno
function fromAT(rec) {
  const f = rec.fields;
  return {
    id: rec.id,
    titulo: f["Título"] || "",
    casa: f["Casa de Leilões"] || "",
    pais: f["País"] || "",
    data: f["Data"] || "",
    estimativaMin: f["Estimativa Mínima"] || null,
    estimativaMax: f["Estimativa Máxima"] || null,
    precoMartelo: f["Preço Martelo"] || null,
    precoFinal: f["Preço Final"] || null,
    tecnica: f["Técnica"] || "",
    dimensoes: f["Dimensões"] || "",
    estado: f["Estado"] || "",
    url: f["URL do Lote"] || "",
    notas: f["Notas"] || "",
  };
}

// Converter objecto interno → campos Airtable
function toAT(o) {
  const f = {};
  if (o.titulo)       f["Título"] = o.titulo;
  if (o.casa)         f["Casa de Leilões"] = o.casa;
  if (o.pais)         f["País"] = o.pais;
  if (o.data)         f["Data"] = o.data;
  if (o.estimativaMin) f["Estimativa Mínima"] = +o.estimativaMin;
  if (o.estimativaMax) f["Estimativa Máxima"] = +o.estimativaMax;
  if (o.precoMartelo) f["Preço Martelo"] = +o.precoMartelo;
  if (o.precoFinal)   f["Preço Final"] = +o.precoFinal;
  if (o.tecnica)      f["Técnica"] = o.tecnica;
  if (o.dimensoes)    f["Dimensões"] = o.dimensoes;
  if (o.estado)       f["Estado"] = o.estado;
  if (o.url)          f["URL do Lote"] = o.url;
  if (o.notas)        f["Notas"] = o.notas;
  return f;
}

const CASAS = [
  { nome: "Cabral Moncada Leilões", pais: "🇵🇹", ativa: true },
  { nome: "Palácio do Correio Velho", pais: "🇵🇹", ativa: true },
  { nome: "Veritas", pais: "🇵🇹", ativa: true },
  { nome: "Leiria & Nascimento", pais: "🇵🇹", ativa: true },
  { nome: "Drouot — Millon", pais: "🇫🇷", ativa: true },
  { nome: "Christie's Paris", pais: "🇫🇷", ativa: true },
  { nome: "Sotheby's", pais: "🌍", ativa: false },
  { nome: "Bonhams", pais: "🌍", ativa: false },
];

const fmt = v => v ? new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(v) : "—";
const fmtDate = d => d ? new Date(d).toLocaleDateString("pt-PT", { day: "2-digit", month: "short", year: "numeric" }) : "—";

function IconLink() {
  return (
    <svg width="12" height="12" viewBox="0 0 13 13" fill="none">
      <path d="M5 2.5H2.5C1.948 2.5 1.5 2.948 1.5 3.5V10.5C1.5 11.052 1.948 11.5 2.5 11.5H9.5C10.052 11.5 10.5 11.052 10.5 10.5V8" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
      <path d="M7.5 1.5H11.5V5.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M11.5 1.5L6 7" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
    </svg>
  );
}

function LinkBtn({ url }) {
  if (!url) return <span style={{ fontSize: 10, color: "#CCC", fontStyle: "italic" }}>sem link</span>;
  return (
    <a href={url} target="_blank" rel="noopener noreferrer"
      style={{ display: "inline-flex", alignItems: "center", gap: 5, color: WINE, fontSize: 11, border: `1px solid ${BORDER}`, borderRadius: 2, padding: "3px 8px" }}
      onMouseOver={e => { e.currentTarget.style.background = "#FDF2F2"; e.currentTarget.style.borderColor = WINE; }}
      onMouseOut={e => { e.currentTarget.style.background = "transparent"; e.currentTarget.style.borderColor = BORDER; }}>
      <IconLink /> Ver lote
    </a>
  );
}

function App() {
  const [obras, setObras] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [erro, setErro] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [filtro, setFiltro] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [obraDetalhe, setObraDetalhe] = useState(null);
  const [scanStatus, setScanStatus] = useState("idle");
  const [lastScan, setLastScan] = useState("Nunca realizada");
  const emptyForm = { titulo: "", casa: "", pais: "", data: "", estimativaMin: "", estimativaMax: "", precoMartelo: "", precoFinal: "", tecnica: "", dimensoes: "", estado: "Vendida", url: "", notas: "" };
  const [form, setForm] = useState(emptyForm);

  // Carregar obras do Airtable
  async function carregarObras() {
    setLoading(true);
    setErro(null);
    try {
      const res = await fetch(`${AT_URL}?sort[0][field]=Data&sort[0][direction]=desc`, { headers: AT_HEADS });
      if (!res.ok) throw new Error("Erro ao carregar dados");
      const data = await res.json();
      setObras((data.records || []).map(fromAT));
    } catch(e) {
      setErro("Não foi possível ligar ao Airtable. Verifica a ligação à internet.");
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { carregarObras(); }, []);

  // Guardar obra nova no Airtable
  async function handleAdd(e) {
    e.preventDefault();
    setSaving(true);
    try {
      const res = await fetch(AT_URL, {
        method: "POST",
        headers: AT_HEADS,
        body: JSON.stringify({ fields: toAT(form) })
      });
      if (!res.ok) throw new Error("Erro ao guardar");
      const data = await res.json();
      setObras(p => [fromAT(data), ...p]);
      setShowForm(false);
      setForm(emptyForm);
    } catch(e) {
      alert("Erro ao guardar a obra. Tenta novamente.");
    } finally {
      setSaving(false);
    }
  }

  function scan() {
    setScanStatus("scanning");
    setTimeout(() => {
      setScanStatus("done");
      setLastScan(new Date().toLocaleString("pt-PT"));
      carregarObras();
      setTimeout(() => setScanStatus("idle"), 3000);
    }, 2500);
  }

  function exportCSV() {
    const h = ["Título","Casa","País","Data","Est.Mín","Est.Máx","Martelo","Final","Técnica","Dimensões","Estado","URL"];
    const rows = obras.map(o => [o.titulo, o.casa, o.pais, o.data, o.estimativaMin||"", o.estimativaMax||"", o.precoMartelo||"", o.precoFinal||"", o.tecnica, o.dimensoes, o.estado, o.url||""]);
    const csv = [h,...rows].map(r=>r.join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download = `cargaleiro-leiloes-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  const vendidas = obras.filter(o => o.estado === "Vendida");
  const totalVendas = vendidas.reduce((s, o) => s + (o.precoFinal || 0), 0);
  const mediaVenda = vendidas.length ? Math.round(totalVendas / vendidas.length) : 0;
  const maxVenda = Math.max(1, ...vendidas.map(o => o.precoFinal || 0));
  const obrasFiltradas = obras.filter(o =>
    o.titulo.toLowerCase().includes(filtro.toLowerCase()) ||
    o.casa.toLowerCase().includes(filtro.toLowerCase())
  );

  const badgeStyle = e => e === "Vendida" ? { background:"#F2F8F2",color:"#1E5C1E",border:"1px solid #C0DCC0" } : e === "A Decorrer" ? { background:"#FFF9EC",color:"#7A5800",border:"1px solid #E8D490" } : { background:"#FDF2F2",color:WINE,border:"1px solid #E8C0C0" };
  const card = { background:BG, border:`1px solid ${BORDER}`, borderRadius:3, padding:"22px 24px" };
  const lbl = { fontSize:10, letterSpacing:1.8, textTransform:"uppercase", color:GRAY, marginBottom:6, display:"block" };
  const inp = { background:BG, border:`1px solid ${BORDER}`, color:BLACK, fontFamily:"Georgia,serif", fontSize:13, padding:"8px 12px", borderRadius:3, width:"100%", outline:"none" };
  const bdg = { display:"inline-block", fontSize:10, letterSpacing:1, textTransform:"uppercase", padding:"3px 8px", borderRadius:2 };

  return (
    <div style={{ fontFamily:"Georgia,serif", background:BG, minHeight:"100vh", color:BLACK }}>

      {obraDetalhe && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.35)", zIndex:100, display:"flex", alignItems:"center", justifyContent:"center" }} onClick={() => setObraDetalhe(null)}>
          <div style={{ background:BG, border:`1px solid ${BORDER}`, borderRadius:4, padding:"32px 36px", maxWidth:540, width:"90%", position:"relative" }} onClick={e => e.stopPropagation()}>
            <button onClick={() => setObraDetalhe(null)} style={{ position:"absolute", top:14, right:18, background:"none", border:"none", cursor:"pointer", color:GRAY, fontSize:20 }}>×</button>
            <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:6 }}>{obraDetalhe.casa} · {obraDetalhe.pais}</div>
            <div style={{ fontSize:19, color:WINE, marginBottom:6 }}>{obraDetalhe.titulo}</div>
            <div style={{ fontSize:12, color:GRAY, marginBottom:22 }}>{obraDetalhe.tecnica} · {obraDetalhe.dimensoes} · {fmtDate(obraDetalhe.data)}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:22 }}>
              {[["Estimativa",`${fmt(obraDetalhe.estimativaMin)} – ${fmt(obraDetalhe.estimativaMax)}`],["Preço de martelo",fmt(obraDetalhe.precoMartelo)],["Preço final c/ comissões",fmt(obraDetalhe.precoFinal)],["Estado",obraDetalhe.estado]].map(([l,v]) => (
                <div key={l} style={{ borderBottom:`1px solid ${BORDER}`, paddingBottom:10 }}>
                  <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:GRAY, marginBottom:4 }}>{l}</div>
                  <div style={{ fontSize:14, color:BLACK }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ background:BG2, border:`1px solid ${BORDER}`, borderRadius:3, padding:"14px 16px" }}>
              <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:GRAY, marginBottom:8 }}>Link do lote no leilão</div>
              {obraDetalhe.url
                ? <a href={obraDetalhe.url} target="_blank" rel="noopener noreferrer" style={{ color:WINE, fontSize:13, wordBreak:"break-all", display:"flex", alignItems:"center", gap:6 }}><IconLink /> {obraDetalhe.url}</a>
                : <span style={{ fontSize:13, color:"#CCC", fontStyle:"italic" }}>Nenhum link registado.</span>}
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div style={{ borderBottom:`1px solid ${BORDER}`, padding:"18px 36px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ width:34, height:34, background:WINE, borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="5.5" stroke="white" strokeWidth="1.2" fill="none"/>
              <circle cx="8" cy="8" r="1.8" fill="white"/>
              <line x1="8" y1="2.5" x2="8" y2="0.5" stroke="white" strokeWidth="1.2"/>
              <line x1="8" y1="15.5" x2="8" y2="13.5" stroke="white" strokeWidth="1.2"/>
              <line x1="0.5" y1="8" x2="2.5" y2="8" stroke="white" strokeWidth="1.2"/>
              <line x1="13.5" y1="8" x2="15.5" y2="8" stroke="white" strokeWidth="1.2"/>
            </svg>
          </div>
          <div>
            <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:2 }}>Fundação Manuel Cargaleiro</div>
            <div style={{ fontSize:17, color:WINE }}>Monitor de Leilões</div>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:20 }}>
          <div style={{ textAlign:"right" }}>
            <div style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:GRAY, marginBottom:3 }}>Última verificação</div>
            <div style={{ fontSize:12, color:BLACK }}>{lastScan}</div>
          </div>
          <button onClick={carregarObras} style={{ background:"none", border:`1px solid ${BORDER}`, color:GRAY, cursor:"pointer", fontFamily:"Georgia,serif", fontSize:11, padding:"6px 12px", borderRadius:3 }}>↺ Actualizar</button>
        </div>
      </div>

      {/* Nav */}
      <div style={{ display:"flex", borderBottom:`1px solid ${BORDER}`, padding:"0 36px" }}>
        {[["dashboard","Painel geral"],["obras","Registo de obras"],["casas","Casas monitorizadas"]].map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)} style={{ background:"none", border:"none", cursor:"pointer", fontFamily:"Georgia,serif", fontSize:13, padding:"11px 16px", color:tab===k?WINE:GRAY, borderBottom:tab===k?`2px solid ${WINE}`:"2px solid transparent", transition:"all 0.15s" }}>{l}</button>
        ))}
      </div>

      <div style={{ padding:"30px 36px", maxWidth:1100 }}>

        {/* Estado de carregamento */}
        {loading && <div style={{ textAlign:"center", padding:"60px 0", color:GRAY, fontSize:14, fontStyle:"italic" }}>A carregar dados do Airtable...</div>}
        {erro && <div style={{ background:"#FDF2F2", border:`1px solid #E8C0C0`, borderRadius:3, padding:"16px 20px", color:WINE, fontSize:13, marginBottom:20 }}>{erro}</div>}

        {!loading && tab === "dashboard" && <>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:14, marginBottom:24 }}>
            {[[obras.length,"Obras registadas"],[vendidas.length,"Vendidas"],[fmt(totalVendas),"Volume total"],[fmt(mediaVenda),"Média por obra"]].map(([n,l],i) => (
              <div key={i} style={card}>
                <div style={{ fontSize:26, color:WINE, marginBottom:5 }}>{n}</div>
                <div style={{ fontSize:10, letterSpacing:1.8, textTransform:"uppercase", color:GRAY }}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:14 }}>
            <div style={card}>
              <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:14 }}>Verificação automática</div>
              <p style={{ fontSize:13, color:GRAY, lineHeight:1.8, marginBottom:16 }}>Pesquisa semanal nas casas ativas por obras de Manuel Cargaleiro.</p>
              <button onClick={scan} disabled={scanStatus==="scanning"} style={{ background:WINE, color:"#FFF", border:"none", cursor:"pointer", fontFamily:"Georgia,serif", fontSize:12, padding:"9px 20px", borderRadius:3, width:"100%", opacity:scanStatus==="scanning"?0.7:1 }}>
                {scanStatus==="scanning"?"A verificar...":scanStatus==="done"?"✓  Concluído":"Verificar agora"}
              </button>
              {scanStatus==="done" && <div style={{ marginTop:8, fontSize:11, color:"#1E5C1E", textAlign:"center" }}>Dados actualizados do Airtable.</div>}
            </div>
            <div style={card}>
              <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:14 }}>Preços de venda</div>
              {vendidas.length === 0 ? <div style={{ fontSize:13, color:GRAY, fontStyle:"italic" }}>Sem obras vendidas registadas.</div> :
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {vendidas.slice(0,5).map((o,i) => (
                  <div key={i}>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                      <span style={{ fontSize:12, color:GRAY, maxWidth:200, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{o.titulo}</span>
                      <span style={{ fontSize:12, color:WINE }}>{fmt(o.precoFinal)}</span>
                    </div>
                    <div style={{ background:BORDER, height:3, borderRadius:2 }}>
                      <div style={{ background:WINE, height:3, borderRadius:2, width:`${((o.precoFinal||0)/maxVenda)*100}%` }}/>
                    </div>
                  </div>
                ))}
              </div>}
            </div>
          </div>
          <div style={card}>
            <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:14 }}>Obras recentes</div>
            {obras.length === 0
              ? <div style={{ padding:"20px 0", textAlign:"center", color:GRAY, fontSize:13, fontStyle:"italic" }}>Nenhuma obra registada ainda. Usa o separador "Registo de obras" para adicionar.</div>
              : obras.slice(0,5).map(o => (
              <div key={o.id} className="hrow" onClick={() => setObraDetalhe(o)} style={{ borderBottom:`1px solid ${BORDER}`, padding:"12px 0", display:"flex", alignItems:"center", gap:16 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:14, color:BLACK, marginBottom:3 }}>{o.titulo}</div>
                  <div style={{ fontSize:11, color:GRAY }}>{o.casa} · {fmtDate(o.data)}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:12 }} onClick={e => e.stopPropagation()}>
                  <LinkBtn url={o.url}/>
                  <div style={{ fontSize:15, color:WINE }}>{fmt(o.precoFinal)}</div>
                  <span style={{ ...bdg, ...badgeStyle(o.estado) }}>{o.estado}</span>
                </div>
              </div>
            ))}
            {obras.length > 0 && <div style={{ paddingTop:10, fontSize:11, color:GRAY, fontStyle:"italic" }}>Clicar numa linha para ver o detalhe completo.</div>}
          </div>
        </>}

        {!loading && tab === "obras" && <>
          <div style={{ display:"flex", gap:10, marginBottom:18, alignItems:"center" }}>
            <input style={{ ...inp, flex:1 }} placeholder="Pesquisar por título ou casa..." value={filtro} onChange={e => setFiltro(e.target.value)}/>
            <button onClick={exportCSV} style={{ background:"none", border:`1px solid ${BORDER}`, color:GRAY, cursor:"pointer", fontFamily:"Georgia,serif", fontSize:12, padding:"9px 18px", borderRadius:3 }}>↓ Exportar CSV</button>
            <button onClick={() => setShowForm(true)} style={{ background:WINE, color:"#FFF", border:"none", cursor:"pointer", fontFamily:"Georgia,serif", fontSize:12, padding:"9px 18px", borderRadius:3 }}>+ Registar obra</button>
          </div>
          {showForm && (
            <div style={{ ...card, marginBottom:18 }}>
              <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:18 }}>Nova obra</div>
              <form onSubmit={handleAdd}>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:14 }}>
                  {[["titulo","Título"],["casa","Casa de leilões"],["tecnica","Técnica"],["dimensoes","Dimensões"]].map(([f,l]) => (
                    <div key={f}><label style={lbl}>{l}</label><input style={inp} value={form[f]} onChange={e => setForm(p=>({...p,[f]:e.target.value}))} required={f==="titulo"}/></div>
                  ))}
                  <div><label style={lbl}>País</label>
                    <select style={inp} value={form.pais} onChange={e => setForm(p=>({...p,pais:e.target.value}))}>
                      <option value="">Selecionar</option>
                      <option>Portugal</option><option>França</option><option>Outros</option>
                    </select>
                  </div>
                  <div><label style={lbl}>Data</label><input type="date" style={inp} value={form.data} onChange={e => setForm(p=>({...p,data:e.target.value}))}/></div>
                  <div><label style={lbl}>Estado</label>
                    <select style={inp} value={form.estado} onChange={e => setForm(p=>({...p,estado:e.target.value}))}>
                      <option>Vendida</option><option>Não Vendida</option><option>A Decorrer</option>
                    </select>
                  </div>
                  {[["estimativaMin","Est. mínima (€)"],["estimativaMax","Est. máxima (€)"],["precoMartelo","Preço martelo (€)"],["precoFinal","Preço final c/ comissões (€)"]].map(([f,l]) => (
                    <div key={f}><label style={lbl}>{l}</label><input type="number" style={inp} value={form[f]} onChange={e => setForm(p=>({...p,[f]:e.target.value}))}/></div>
                  ))}
                  <div style={{ gridColumn:"1 / -1" }}>
                    <label style={lbl}>URL do lote no leilão</label>
                    <input type="url" style={{ ...inp, fontFamily:"monospace", fontSize:12 }} placeholder="https://www.casadeleiloes.com/lote/..." value={form.url} onChange={e => setForm(p=>({...p,url:e.target.value}))}/>
                  </div>
                  <div style={{ gridColumn:"1 / -1" }}>
                    <label style={lbl}>Notas</label>
                    <textarea style={{ ...inp, height:70, resize:"vertical" }} value={form.notas} onChange={e => setForm(p=>({...p,notas:e.target.value}))}/>
                  </div>
                </div>
                <div style={{ display:"flex", gap:10 }}>
                  <button type="submit" disabled={saving} style={{ background:WINE, color:"#FFF", border:"none", cursor:"pointer", fontFamily:"Georgia,serif", fontSize:12, padding:"9px 20px", borderRadius:3, opacity:saving?0.7:1 }}>{saving?"A guardar...":"Guardar"}</button>
                  <button type="button" onClick={() => setShowForm(false)} style={{ background:"none", border:`1px solid ${BORDER}`, color:GRAY, cursor:"pointer", fontFamily:"Georgia,serif", fontSize:12, padding:"9px 20px", borderRadius:3 }}>Cancelar</button>
                </div>
              </form>
            </div>
          )}
          <div style={card}>
            <div style={{ display:"grid", gridTemplateColumns:"2fr 1.4fr 1fr 1fr 1fr 80px 90px", gap:8, paddingBottom:10, borderBottom:`1px solid ${BORDER}`, marginBottom:2 }}>
              {["Obra","Casa / País","Estimativa","Martelo","Final","Estado","Lote"].map(h => (
                <div key={h} style={{ fontSize:10, letterSpacing:1.5, textTransform:"uppercase", color:GRAY }}>{h}</div>
              ))}
            </div>
            {obrasFiltradas.length === 0 && <div style={{ padding:"28px 0", textAlign:"center", color:GRAY, fontSize:13, fontStyle:"italic" }}>Nenhuma obra encontrada.</div>}
            {obrasFiltradas.map(o => (
              <div key={o.id} className="hrow" onClick={() => setObraDetalhe(o)} style={{ display:"grid", gridTemplateColumns:"2fr 1.4fr 1fr 1fr 1fr 80px 90px", gap:8, alignItems:"center", borderBottom:`1px solid ${BORDER}`, padding:"12px 0" }}>
                <div>
                  <div style={{ fontSize:13, color:BLACK }}>{o.titulo}</div>
                  <div style={{ fontSize:11, color:GRAY, marginTop:2 }}>{o.tecnica} · {fmtDate(o.data)}</div>
                </div>
                <div>
                  <div style={{ fontSize:12, color:BLACK }}>{o.casa}</div>
                  <div style={{ fontSize:11, color:GRAY }}>{o.pais}</div>
                </div>
                <div style={{ fontSize:12, color:GRAY }}>{fmt(o.estimativaMin)}–{fmt(o.estimativaMax)}</div>
                <div style={{ fontSize:13, color:BLACK }}>{fmt(o.precoMartelo)}</div>
                <div style={{ fontSize:14, color:WINE }}>{fmt(o.precoFinal)}</div>
                <span style={{ ...bdg, ...badgeStyle(o.estado) }}>{o.estado}</span>
                <div onClick={e => e.stopPropagation()}><LinkBtn url={o.url}/></div>
              </div>
            ))}
            {obrasFiltradas.length > 0 && <div style={{ paddingTop:10, fontSize:11, color:GRAY, fontStyle:"italic" }}>Clicar numa linha para ver o detalhe completo.</div>}
          </div>
        </>}

        {!loading && tab === "casas" && <>
          <div style={{ fontSize:11, letterSpacing:1.5, textTransform:"uppercase", color:GRAY, marginBottom:18 }}>
            {CASAS.filter(c=>c.ativa).length} casas ativas · {CASAS.filter(c=>!c.ativa).length} pendentes de integração
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
            {CASAS.map((c,i) => (
              <div key={i} style={{ ...card, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 20px" }}>
                <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                  <div style={{ width:7, height:7, borderRadius:"50%", background:c.ativa?"#2D8B2D":"#CCC" }}/>
                  <div style={{ fontSize:13, color:BLACK }}>{c.pais} {c.nome}</div>
                </div>
                <span style={{ ...bdg, ...(c.ativa?{background:"#F2F8F2",color:"#1E5C1E",border:"1px solid #C0DCC0"}:{background:"#FDF2F2",color:WINE,border:"1px solid #E8C0C0"}) }}>
                  {c.ativa?"Ativa":"Pendente"}
                </span>
              </div>
            ))}
          </div>
          <div style={{ ...card, borderLeft:`3px solid ${WINE}`, borderRadius:"0 3px 3px 0" }}>
            <div style={{ fontSize:10, letterSpacing:2, textTransform:"uppercase", color:GRAY, marginBottom:10 }}>Próximo passo recomendado</div>
            <p style={{ fontSize:13, color:GRAY, lineHeight:1.8, fontStyle:"italic" }}>
              Para cobrir Sotheby's, Bonhams e o mercado asiático, recomenda-se a subscrição do <span style={{ color:BLACK, fontStyle:"normal" }}>Mutualart</span> (aproximadamente €15/mês) com alertas automáticos por artista.
            </p>
          </div>
        </>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
