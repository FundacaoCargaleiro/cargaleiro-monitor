<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registo e Avaliação de Mercado — Manuel Cargaleiro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Georgia,serif;background:#fff;color:#1A1A1A;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#E8E0E0;}
    .hrow:hover{background:#FAFAF9;}
    input:focus,select:focus{border-color:#6B1A1A!important;outline:none;}
    table{border-collapse:collapse;width:100%;}
    th{font-family:Georgia,serif;font-size:11px;font-weight:normal;letter-spacing:1px;text-transform:uppercase;color:#6B6B6B;padding:8px 10px;border-bottom:2px solid #E8E0E0;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;}
    th:hover{color:#6B1A1A;}
    th.r,td.r{text-align:right;}
    td{font-family:Georgia,serif;font-size:13px;color:#1A1A1A;padding:9px 10px;border-bottom:1px solid #F0EAEA;vertical-align:middle;}
    td.wine{text-align:right;color:#6B1A1A;font-weight:bold;}
    td.cm2c{text-align:right;color:#7A3A0A;}
    tr:hover td{background:#FAFAF9;}
    .nav-btn{background:none;border:none;cursor:pointer;font-family:Georgia,serif;font-size:13px;padding:10px 16px;transition:all 0.15s;border-bottom:2px solid transparent;white-space:nowrap;}
    .nav-btn.active{color:#6B1A1A;border-bottom:2px solid #6B1A1A;}
    .nav-btn:not(.active){color:#6B6B6B;}
    .card{background:#fff;border:1px solid #E8E0E0;border-radius:3px;padding:20px 22px;}
    .stat-num{font-size:26px;color:#6B1A1A;margin-bottom:4px;}
    .stat-lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6B6B;}
    .section-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6B6B;margin-bottom:14px;font-weight:bold;}
    .bar-bg{background:#F0EAEA;height:4px;border-radius:2px;margin-top:4px;}
    .bar-fill{background:#6B1A1A;height:4px;border-radius:2px;}
    .bar-fill-amber{background:#B06A10;height:4px;border-radius:2px;}
    .tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:2px;border:1px solid #E8C0C0;background:#FDF2F2;color:#6B1A1A;}
    .inp{background:#fff;border:1px solid #E8E0E0;color:#1A1A1A;font-family:Georgia,serif;font-size:13px;padding:7px 10px;border-radius:3px;width:100%;outline:none;}
    .btn-wine{background:#6B1A1A;color:#fff;border:none;cursor:pointer;font-family:Georgia,serif;font-size:12px;padding:8px 18px;border-radius:3px;}
    .btn-out{background:none;border:1px solid #E8E0E0;color:#6B6B6B;cursor:pointer;font-family:Georgia,serif;font-size:12px;padding:8px 18px;border-radius:3px;}
    .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6B6B6B;margin-bottom:5px;display:block;}
    .sim-box{background:#FDF2F2;border:1px solid #E8C0C0;border-radius:3px;padding:14px 18px;margin-top:14px;}
    .btn-edit{background:none;border:1px solid #E8E0E0;color:#6B6B6B;cursor:pointer;font-family:Georgia,serif;font-size:11px;padding:3px 9px;border-radius:2px;}
    .btn-edit:hover{border-color:#6B1A1A;color:#6B1A1A;}
    .btn-del{background:none;border:1px solid #E8C0C0;color:#9B3A3A;cursor:pointer;font-family:Georgia,serif;font-size:11px;padding:3px 9px;border-radius:2px;}
    .btn-del:hover{background:#FDF2F2;}
    .edit-row{background:#FEF8F0!important;}
    .edit-row td{padding:6px 10px!important;}
    .highlight-obra{background:#FAFAF9;border:1px solid #E8E0E0;border-radius:3px;padding:12px 16px;}
  </style>
</head>

function PainelTecnica({obras,tecnica}){
  const grupo=obras.filter(o=>o.t===tecnica);
  const comV=grupo.filter(o=>o.v!=null);
  const comC=grupo.filter(o=>o.c!=null);
  const total=comV.reduce((s,o)=>s+o.v,0);
  const media=comV.length?total/comV.length:0;
  const mediaCm2=comC.length?comC.reduce((s,o)=>s+o.c,0)/comC.length:0;
  const mais=comV.length?comV.reduce((a,b)=>b.v>a.v?b:a):null;
  const menos=comV.length?comV.reduce((a,b)=>b.v<a.v?b:a):null;
  const ultima=comV.length?comV.reduce((a,b)=>{if(b.av>a.av)return b;if(b.av===a.av&&b.v>a.v)return b;return a;}):null;

  const porAnoN={}, porAnoV={};
  comV.forEach(o=>{
    const y=o.av;
    porAnoN[y]=(porAnoN[y]||0)+1;
    porAnoV[y]=(porAnoV[y]||0)+o.v;
  });
  const anos=Object.keys(porAnoN).sort();
  const dataN=anos.map(y=>({k:y,v:porAnoN[y],label:porAnoN[y]+" obra"+(porAnoN[y]>1?"s":"")}));
  const dataV=anos.map(y=>({k:y,v:porAnoV[y]}));

  const [simH,setSimH]=useState("");
  const [simL,setSimL]=useState("");
  const simArea=simH&&simL?Math.round(+simH*+simL*100)/100:null;
  const simVal=simArea&&mediaCm2?Math.round(simArea*mediaCm2):null;

  const g2={display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16};
  const g3={display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:16};

  return React.createElement("div",null,
    React.createElement("div",{style:{marginBottom:20}},
      React.createElement("div",{style:{fontSize:10,letterSpacing:2,textTransform:"uppercase",color:GR,marginBottom:4}},"Técnica"),
      React.createElement("div",{style:{fontSize:20,color:W}},tecnica)
    ),
    React.createElement("div",{style:g3},
      ...[
        [comV.length,"Obras vendidas"],
        [fe(total),"Volume total"],
        [fe(media),"Preço médio"],
        [fe(mediaCm2)+"/cm²","€/cm² médio"],
        [comC.length,"Com dados cm²"],
      ].map(([n,l],i)=>React.createElement("div",{key:i,className:"card"},
        React.createElement("div",{className:"stat-num",style:{fontSize:20}},n),
        React.createElement("div",{className:"stat-lbl"},l)
      ))
    ),
    React.createElement("div",{style:g2},
      React.createElement("div",{className:"card"},
        React.createElement("div",{className:"section-title"},"Obra mais cara"),
        React.createElement(ObraCard,{obra:mais})
      ),
      React.createElement("div",{className:"card"},
        React.createElement("div",{className:"section-title"},"Obra mais barata"),
        React.createElement(ObraCard,{obra:menos})
      )
    ),
    React.createElement("div",{style:g2},
      React.createElement("div",{className:"card"},
        React.createElement("div",{className:"section-title"},"Obras vendidas por ano"),
        React.createElement(MiniBarChart,{data:dataN,color:"#4A7A2A"})
      ),
      React.createElement("div",{className:"card"},
        React.createElement("div",{className:"section-title"},"Volume de vendas por ano"),
        React.createElement(MiniBarChart,{data:dataV})
      )
    ),
    React.createElement("div",{className:"card",style:{borderLeft:"3px solid "+W,borderRadius:"0 3px 3px 0"}},
      React.createElement("div",{className:"section-title"},"Simulador de valor — com base no €/cm² médio desta técnica ("+fe(mediaCm2)+"/cm²)"),
      React.createElement("div",{style:{display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}},
        React.createElement("div",null,
          React.createElement("label",{className:"lbl"},"Altura (cm)"),
          React.createElement("input",{className:"inp",type:"number",step:"0.1",style:{width:110},value:simH,onChange:e=>setSimH(e.target.value)})
        ),
        React.createElement("div",null,
          React.createElement("label",{className:"lbl"},"Largura / Diâmetro (cm)"),
          React.createElement("input",{className:"inp",type:"number",step:"0.1",style:{width:140},value:simL,onChange:e=>setSimL(e.target.value)})
        )
      ),
      simVal!=null&&React.createElement("div",{className:"sim-box",style:{marginTop:14}},
        React.createElement("div",{style:{fontSize:11,color:GR,letterSpacing:1,textTransform:"uppercase",marginBottom:6}},"Estimativa de valor"),

        )
      )
    )
  );
}
